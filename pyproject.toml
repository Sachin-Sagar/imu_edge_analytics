[project]
name = "edge-imu-motion-analytics"
version = "0.1.0"
description = "Edge IMU Motion Analytics & Vibration DSP Engine: High-Frequency Telemetry Processing, Jump Kinematics & Power Optimization"
readme = "README.md"
authors = [{name = "Sachin Sagar"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "ipykernel>=6.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


